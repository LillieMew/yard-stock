<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2a37">
  <link rel="manifest" href="manifest.json">
  <title>Yard Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Yard Stock</h1>
    <section>
      <label for="search-box">Search stock</label>
      <input type="search" id="search-box" placeholder="4x2 treated">
      <div class="chip-row">
        <button type="button" class="chip selected" data-category="All">All</button>
        <button type="button" class="chip" data-category="Timber">Timber</button>
        <button type="button" class="chip" data-category="Plumbing">Plumbing</button>
        <button type="button" class="chip" data-category="Fixings">Fixings</button>
      </div>
          <p>Size:</p>
    <div class="chip-row">
      <button type="button" class="chip" data-size="4x2">4x2</button>
      <button type="button" class="chip" data-size="5x2">5x2</button>
      <button type="button" class="chip" data-size="6x2">6x2</button>
    </div>
    <p>Length:</p>
    <div class="chip-row">
      <button type="button" class="chip" data-length="3.6m">3.6m</button>
      <button type="button" class="chip" data-length="4.2m">4.2m</button>
      <button type="button" class="chip" data-length="4.8m">4.8m</button>
      <button type="button" class="chip" data-length="5.4m">5.4m</button>
    </div>
    <div id="treatment-group">
      <p>Type:</p>
      <div class="chip-row">
        <button type="button" class="chip" data-treatment="Treated">Treated</button>
        <button type="button" class="chip" data-treatment="Pressure treated">Pressure treated</button>
        <button type="button" class="chip" data-treatment="PAR">PAR</button>
        <button type="button" class="chip" data-treatment="Rough">Rough</button>
      </div>
    </div>
    </section>

  <ul id="results"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
