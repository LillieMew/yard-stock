<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2a37">
  <link rel="manifest" href="manifest.json">
  <title>Yard Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <h1>Yard Stock</h1>
    <section>
      <label for="search-box">Search stock</label>
      <input type="search" id="search-box" placeholder="4x2 treated">
      <div class="chip-row">
        <button type="button" class="chip selected">All</button>
        <button type="button" class="chip">Timber</button>
        <button type="button" class="chip">Plumbing</button>
        <button type="button" class="chip">Fixings</button>
        <button type="button" class="chip">Electrical</button>
      </div>
    </section>

  <ul id="results"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
